const LONG_RAW=`Muschel|Lege dich auf die Seite, Kopf auf dem unteren Arm oder einem Kissen. Die Beine liegen übereinander, Hüften und Knie sind etwa 45° gebeugt, die Füße bleiben auf einer Linie mit dem Gesäß. Halte die Fersen zusammen und öffne das obere Knie wie eine Muschel so weit, wie es geht, ohne dass das Becken nach hinten kippt (eine Hand auf der oberen Hüfte hilft zur Kontrolle). Kurz halten und langsam schließen. Die Zeichnung zeigt die Position von oben: Das untere Bein bleibt liegen, das obere klappt auf.
Seitliches Beinheben|Lege dich auf die Seite, der Körper bildet eine gerade Linie von Kopf bis Fuß. Der untere Arm stützt den Kopf, die obere Hand liegt zur Stabilität vor dem Körper auf dem Boden. Das untere Bein darf leicht gebeugt sein. Hebe das obere Bein gestreckt etwa 30 bis 45° an, ohne dass sich das Becken nach hinten dreht, halte kurz und lege es langsam wieder ab. Die Zeichnung zeigt die Seitlage von hinten betrachtet.
Seitstütz|Lege dich auf die Seite, der Ellbogen liegt genau unter der Schulter, der Unterarm quer zum Körper auf dem Boden. Die Beine sind gestreckt und übereinander (leichter: Knie gebeugt am Boden lassen). Hebe das Becken an, bis Schulter, Hüfte und Füße eine gerade Linie bilden, und halte Rumpf und Gesäß angespannt. Die Hüfte darf nicht nach hinten oder unten durchsacken, atme ruhig weiter. Nach der Haltezeit das Becken kontrolliert absenken und die Seite wechseln.
Piriformis-Dehnung|Lege dich auf den Rücken, beide Knie gebeugt, Füße auf dem Boden. Lege den Knöchel des einen Beins knapp über das Knie des anderen, sodass die Beine eine „4“ bilden. Umfasse den Oberschenkel des unten stehenden Beins (oder dahinter) und ziehe ihn sanft zur Brust, bis du die Dehnung tief im Gesäß der oberen Seite spürst. Kopf und Schultern bleiben entspannt am Boden, den Druck auf das obere Knie sanft halten. 30 Sekunden halten, dann die Seite wechseln. Die Zeichnung zeigt das gekreuzte Bein nur vereinfacht.
Nackendehnung|Setze oder stelle dich aufrecht hin, die Schultern hängen entspannt nach unten. Neige den Kopf langsam seitlich, als wolle das Ohr zur Schulter wandern, ohne die Schulter hochzuziehen. Zum Verstärken legst du die Hand der gleichen Seite locker auf den Kopf, nur mit dem Gewicht der Hand und ohne zu ziehen. Der andere Arm hängt entspannt nach unten. Ruhig atmen, 20 bis 30 Sekunden halten, dann die Seite wechseln. Bei Kribbeln, Schwindel oder Schmerz sofort lösen. Die Zeichnung zeigt die Ansicht von vorn.
Katze-Kuh|Beginne im Vierfüßlerstand: Hände unter den Schultern, Knie unter den Hüften, Rücken neutral. Katze: Atme aus, runde den Rücken nach oben wie ein Katzenbuckel, das Kinn geht zur Brust, der Bauchnabel Richtung Wirbelsäule. Kuh: Atme ein, senke den Bauch, hebe Brustbein und Steißbein an und blicke leicht nach vorn, ohne den Nacken zu überstrecken. Wechsle langsam im Atemrhythmus, nur im schmerzfreien Bereich. Die Zeichnung zeigt vereinfacht Start = Katze und Ende = Kuh.
Brustdehnung im Türrahmen|Stelle dich in einen Türrahmen. Hebe den Unterarm senkrecht an den Rahmen, der Ellbogen ist auf Schulterhöhe im rechten Winkel gebeugt. Setze einen Fuß einen kleinen Schritt nach vorn durch die Tür und verlagere das Gewicht langsam nach vorn, bis du die Dehnung an Brust und Schulterfront spürst. Der Rücken bleibt gerade, kein Hohlkreuz. 20 bis 30 Sekunden halten, dann die Seite wechseln. Bei Kribbeln in Arm oder Hand sofort lösen.
Skater-Sprünge|Stelle dich auf ein Bein, Knie leicht gebeugt, Oberkörper etwas nach vorn geneigt. Springe seitlich mit Schwung auf das andere Bein, lande weich auf dem Vorfuß und lasse das Standbein schräg hinter dem Körper schweben, ohne es abzusetzen. Die Arme schwingen locker gegengleich mit. Stabilisiere kurz, dann springe zur anderen Seite zurück. Wähle den Abstand so, dass du sicher und kontrolliert landest. Die Zeichnung zeigt Start auf dem linken und Landung auf dem rechten Bein.
Bergsteiger|Gehe in die hohe Liegestützposition: Hände unter den Schultern, Arme gestreckt, Körper eine gerade Linie von Kopf bis Ferse, Bauch und Gesäß angespannt. Ziehe abwechselnd ein Knie schnell Richtung Brust, das andere Bein bleibt gestreckt mit den Zehen am Boden. Die Hüfte bleibt tief und der Rücken gerade, du läufst gewissermaßen auf der Stelle. Starte langsam und steigere das Tempo erst, wenn die Haltung sauber ist.
Dips am Stuhl|Setze dich an die Kante eines stabilen Stuhls (an die Wand stellen, damit er nicht rutscht). Die Hände stützen neben dem Gesäß auf der Kante, die Finger zeigen nach vorn. Rutsche mit dem Gesäß vor die Sitzfläche, die Beine sind gestreckt oder angewinkelt (leichter). Beuge die Ellbogen nach hinten bis etwa 90°, ohne dass die Schultern nach oben wandern, und drücke dich wieder hoch, ohne die Ellbogen ganz durchzudrücken. Der Rücken bleibt nah am Stuhl.`;

const LONG2_RAW=`Schulterkreisen|Die Zeichnung zeigt die Ansicht von vorn: Start mit hängenden Schultern, Ende mit hochgezogenen Schultern. Beim Üben ziehst du die Schultern erst hoch, dann nach hinten, senkst sie und führst sie wieder nach vorn, ein langsamer, runder Kreis. 8 bis 10 Kreise, dann die Richtung wechseln.
Hüftkreisen|Die Zeichnung zeigt von vorn den Start und eine Zwischenstellung, in der das Becken zur Seite geschoben ist. Beim Üben schiebst du das Becken nacheinander nach rechts, hinten, links und vorn, sodass es einen großen Kreis zeichnet. Die Schultern bleiben dabei ruhig über den Füßen.
Armkreisen|Die Zeichnung zeigt von vorn den Start (Arme hängen) und das Ende (Arme waagerecht). Aus dieser Position kreist du die gestreckten Arme zunächst klein, dann größer, erst vorwärts, dann rückwärts. Die Schultern bleiben unten, der Nacken locker.
Handgelenkkreisen|Die Zeichnung zeigt den Arm von der Seite mit einem Pfeil für die Kreisbewegung. Halte den Unterarm ruhig und lasse nur die Hand kreisen: nach oben, außen, unten, innen. Erst 10 Kreise in eine, dann in die andere Richtung.
Gewichtsverlagerung|Die Zeichnung zeigt von vorn den Start (Gewicht in der Mitte) und das Ende (Gewicht auf einem Bein). Verschiebe das Becken seitlich über ein Bein, ohne den Oberkörper mitzukippen, und entlaste das andere Bein fast vollständig. Dann wechselst du im gleichen Tempo zur anderen Seite.
Seitgang|Die Zeichnung zeigt von vorn den Start (Füße zusammen) und das Ende (ein Fuß seitlich abgesetzt). Setze einen Fuß zur Seite, verlagere das Gewicht darauf und ziehe den anderen Fuß nach, ohne die Füße zu kreuzen. Die Knie bleiben leicht gebeugt, die Zehen zeigen nach vorn.
Tandemgang|Die Zeichnung zeigt von der Seite den Start und einen Schritt. Setze beim Gehen die Ferse jeweils direkt vor die Zehen des anderen Fußes, als würdest du auf einem Seil gehen. Die Arme helfen seitlich beim Ausbalancieren. Bei Unsicherheit an einer Wand entlang üben.
Kissen-Balance|Die Zeichnung zeigt von der Seite das Kissen als flaches Rechteck unter den Füßen. Stelle dich zuerst auf beide Füße, halte 30 Sekunden und hebe dann ein Bein leicht an. Die Knie bleiben locker, der Blick geht zu einem festen Punkt. Neben einer Wand oder Stuhllehne üben.
Knie zur Brust|Die Zeichnung zeigt von der Seite die Rückenlage mit gebeugten Beinen, im Endbild ist ein Knie zur Brust gezogen. Beim Üben greifst du Schienbein oder Oberschenkel mit beiden Händen und ziehst es sanft heran. Das Becken bleibt am Boden, der Kopf entspannt.
Fahrrad-Crunch|Die Zeichnung zeigt von der Seite den Start mit angehobenen Beinen und das Ende mit angehobenem Oberkörper. Beim Üben drehst du den Oberkörper so, dass der Ellbogen zum gegenüberliegenden Knie geht, während sich das andere Bein streckt. Die Bewegung kommt aus dem Rumpf, nicht aus dem Nacken.
Kobra-Heben|Die Zeichnung zeigt die Bauchlage von der Seite: Start flach, Ende mit angehobenem Oberkörper. Hebe nur Kopf und Brust wenige Zentimeter an, die Arme liegen neben dem Körper, die Schulterblätter ziehen zusammen und nach unten. Der Blick geht zum Boden, die Beine bleiben liegen.
Einbeinige Hüftbrücke|Die Zeichnung zeigt von der Seite die Brücke, im Endbild mit einem gestreckten Bein. Das Standbein drückt Becken und Gesäß nach oben, das andere Bein ist gestreckt in einer Linie mit dem Oberschenkel des Standbeins. Das Becken bleibt waagerecht, ohne seitlich abzukippen.
Bauchatmung|Die Zeichnung zeigt die Rückenlage mit angewinkelten Beinen, die Hand liegt am Bauch. Der Bogen im Endbild zeigt, dass sich der Bauch beim Einatmen hebt. Atme durch die Nase ein, lass den Bauch nach oben kommen und atme ruhig und lang durch den Mund aus.
Greifkraft-Training|Die Zeichnung zeigt den ausgestreckten Arm, im Endbild mit einem Punkt für die geschlossene Faust um den Ball. Beim Üben kannst du im Sitzen oder Stehen trainieren, der Arm liegt locker auf dem Oberschenkel oder hängt neben dem Körper. Drücke mit gleichmäßigem Druck, nicht ruckartig.
Nacken-Isometrie|Die Zeichnung zeigt von der Seite die Hand an der Stirn. Der Kopf drückt gegen die Hand, die Hand hält dagegen, sodass sich nichts bewegt. Wiederhole an der Schläfe (links, rechts) und am Hinterkopf. Der Druck ist leicht bis mittel, der Kiefer bleibt locker.
Kurzer Fuß|Die Zeichnung zeigt den sitzenden Körper von der Seite, im Endbild ist das Fußgewölbe leicht angedeutet gehoben. Beim Üben bleiben Ferse und Zehen am Boden, du ziehst den Vorfuß zur Ferse und hebst damit die Fußmitte, ohne die Zehen einzukrallen. Die Bewegung ist klein.
Katzenbuckel im Sitzen|Die Zeichnung zeigt von der Seite den Start mit rundem Rücken und das Ende mit aufgerichtetem Rücken. Wechsle langsam zwischen den beiden Positionen. Beim Aufrichten schiebst du die Brust vor und die Schulterblätter nach hinten unten, beim Runden fällt der Kopf entspannt nach vorn.
Tiefe Hocke halten|Die Zeichnung zeigt von der Seite den Start im Stand und das Ende in der tiefen Hocke. Hüfte und Knie sind tief gebeugt, die Fersen bleiben am Boden, der Rücken ist lang. Wenn die Fersen abheben, lege ein gefaltetes Handtuch darunter. Halte dich bei Bedarf an einem Türrahmen fest.
Schmetterling-Dehnung|Die Zeichnung zeigt von vorn den Sitz mit zusammengelegten Fußsohlen, im Endbild sind die Knie abgesenkt. Halte die Füße mit den Händen und richte den Rücken auf, bevor du dich leicht nach vorn neigst. Drücke die Knie nicht mit Gewalt nach unten, sie sinken durch die Schwerkraft.
Trizeps-Dehnung|Die Zeichnung zeigt von vorn den Start und das Ende mit dem Arm über dem Kopf. Der Ellbogen zeigt zur Decke, die Hand liegt hinter dem Kopf zwischen den Schulterblättern. Die andere Hand fasst den Ellbogen und schiebt ihn sanft nach hinten, bis du die Dehnung an der Oberarmrückseite spürst.
Schulter-Tippen im Stütz|Die Zeichnung zeigt von der Seite den hohen Stütz, im Endbild mit einer Hand an der Schulter. Löse eine Hand und tippe die gegenüberliegende Schulter an, ohne dass sich das Becken dreht oder absackt. Stelle die Beine etwas breiter, wenn du wackelst.
Schulterdehnung quer|Die Zeichnung zeigt von vorn den Arm quer über der Brust. Der gestreckte Arm liegt waagerecht vor der Brust, der andere Unterarm zieht ihn am Ellbogen sanft heran. Die Schulter bleibt unten, der Oberkörper bleibt nach vorn gerichtet.`;

x+=`<circle cx="${px}" cy="${py}" r="2.8" fill="${hip?"var(--mc)":"var(--bb)"}"/><circle cx="${sx}" cy="${sy}" r="2.7" fill="${sho?"var(--mc)":"var(--bb)"}"/><circle cx="${hx}" cy="${hy}" r="3.2" fill="var(--bb)"/>`;
if(p[2]==="d")x+=`<circle cx="${wx}" cy="${wy}" r="2.6" fill="var(--tx)"/>`;
return`<svg viewBox="0 0 48 48" width="100%" height="100%" fill="none" stroke-linecap="round"><path d="M2 44.6H46" stroke="var(--bd)" stroke-width="1.2"/>${th}${x}</svg>`}
function legend(e){const t=(e.n||"")+" "+(e.g||""),r=Object.keys(REG).filter(k=>k!=="Ganzkörper"&&REG[k].test(t));return r.length?"<span style='color:var(--mc)'>●</span> Beansprucht (orange): "+r.join(", "):""}
function applyTheme(){const t=S.theme,r=document.documentElement;if(t==="light"||t==="dark")r.setAttribute("data-theme",t);else r.removeAttribute("data-theme");const b=document.getElementById("thb");if(b)b.textContent=t==="light"?"☀️ Hell":t==="dark"?"🌙 Dunkel":"🌓 Auto"}
function theme(){S.theme=S.theme==="light"?"dark":S.theme==="dark"?"auto":"light";save();applyTheme()}
function fig(e,w,z){const c=e.fig&&e.fig[w];return`<div class="fg" style="width:${z}px;height:${z}px">${c?(c.slice(0,2)==="BR"?orbSvg(c[2]):figSvg(c,e)):(e.draw&&e.draw[w]?`<img src="${e.draw[w]}" alt="" style="width:100%;height:100%;object-fit:contain">`:e.img&&!w?`<img src="${e.img}" alt="" style="width:100%;height:100%;object-fit:cover">`:`<svg viewBox="0 0 40 40" width="${z*0.5}" height="${z*0.5}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".35"><circle cx="20" cy="8" r="4"/><path d="M20 12v12M20 16l-8 6M20 16l8 6M20 24l-6 12M20 24l6 12"/></svg>`)}${z>60?`<span class="mu fl">${w?"Ende":"Start"}</span>`:""}</div>`}
function cForm(){return`<div class="c"><label class="mu">Name</label><input id="cn"><label class="mu">Beschreibung</label><textarea id="cd2" rows="3"></textarea><label class="mu">Foto</label><input type="file" id="cf" accept="image/*"><label class="mu">Start- und Endposition zeichnen (mit dem Finger)</label><div class="r" style="flex-wrap:nowrap;align-items:flex-start"><div style="flex:1"><div class="mu">Start</div><canvas id="cvS" class="cv" width="240" height="240"></canvas><button class="chip" style="margin-top:6px" onclick="cvClear('cvS')">Löschen</button></div><div style="flex:1"><div class="mu">Ende</div><canvas id="cvE" class="cv" width="240" height="240"></canvas><button class="chip" style="margin-top:6px" onclick="cvClear('cvE')">Löschen</button></div></div><div class="r" style="margin-top:8px"><button class="b" onclick="addEx()">Speichern</button></div></div>`}
function addEx(){const n=document.getElementById("cn").value.trim();if(!n){toast("Bitte einen Namen eingeben.");return}
 const d=document.getElementById("cd2").value,f=document.getElementById("cf").files[0],ds=["cvS","cvE"].map(id=>{const c=document.getElementById(id);return c&&c.dataset.dirty?c.toDataURL("image/png"):""});
 const fin=img=>{S.custom.push({id:"c"+Date.now(),n,al:[],c:"Eigene",m:"",d,s:"",e:"",img,draw:ds.some(Boolean)?ds:undefined});save();cf=false;cat="Eigene";render()};
 if(!f)return fin();const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,500/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);fin(c.toDataURL("image/jpeg",.7))};im.src=r.result};r.readAsDataURL(f)}
function delEx(id){if(cdel!==id){cdel=id;toast("Zum Löschen noch einmal tippen");return}cdel=null;S.custom=S.custom.filter(c=>c.id!==id);save();render()}

function vHist(){
 const now=new Date();let h=`<h2>Verlauf</h2>`+statsHtml();
 const mon=new Date(now);mon.setDate(now.getDate()-wd(now));
 h+=`<div class="c"><h3>Diese Woche</h3>`;
 if(!S.plans.length)h+=`<div class="mu">Noch keine Pläne.</div>`;
 S.plans.forEach(p=>{const tgt=p.days.length||p.pw;let done=0;for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);if(planPct(p,iso(d))>0)done++}
  const pc=Math.min(100,Math.round(done/tgt*100));h+=`<div style="margin-top:8px"><b>${esc(p.name)}</b> <span class="mu">${done} von ${tgt} Einheiten · ${pc}%</span><div class="bar"><i style="width:${pc}%"></i></div></div>`});
 h+=`</div>`;
 const ds=Object.keys(S.log).sort().reverse();
 if(!ds.length)h+=`<div class="c mu">Sobald du Sets abhakst, erscheinen sie hier.</div>`;
 ds.forEach(d=>{const rows=S.plans.filter(p=>planPct(p,d)>0);if(!rows.length)return;
  h+=`<div class="c"><b>${new Date(d+"T12:00").toLocaleDateString("de-AT",{weekday:"short",day:"numeric",month:"short",year:"numeric"})}</b>`;
  rows.forEach(p=>{const pc=planPct(p,d);h+=`<div style="margin-top:6px">${esc(p.name)} <span class="mu">${pc}%</span><div class="bar"><i style="width:${pc}%"></i></div></div>`});h+=`</div>`});
 return h}
S.qi=((S.qi==null?-1:S.qi)+1)%QUOTES.length;save();applyTheme();render();
</script>
